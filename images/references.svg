<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
	<rect width="800" height="500" fill="#242943"/>
	<!-- a stack of books next to a reference list -->
	<g fill="#ffffff" fill-opacity="0.3">
		<rect x="180" y="330" width="230" height="40" rx="4"/>
		<rect x="200" y="285" width="200" height="40" rx="4"/>
		<rect x="170" y="240" width="220" height="40" rx="4"/>
		<rect x="195" y="195" width="190" height="40" rx="4"/>
	</g>
	<g stroke="#ffffff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
		<line x1="470" y1="200" x2="640" y2="200"/>
		<line x1="490" y1="225" x2="610" y2="225"/>
		<line x1="470" y1="265" x2="630" y2="265"/>
		<line x1="490" y1="290" x2="600" y2="290"/>
		<line x1="470" y1="330" x2="640" y2="330"/>
		<line x1="490" y1="355" x2="590" y2="355"/>
	</g>
	<line x1="140" y1="370" x2="440" y2="370" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
</svg>
